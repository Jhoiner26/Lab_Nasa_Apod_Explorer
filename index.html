<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronomy Picture of the Day (APOD)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Bienvenido a la NASA </h1>
        <p>Descubre la imagen diaria que tenemos para ti</p>
    </header>

    <main>
        <section>
            <h2>Imagen del día</h2>
            <img id="imagen-nasa" src="" alt="Imagen del día">
            <p id="fecha-imagen"></p>
            <p id="explicacion-imagen"></p>

            <button id="btn-favorito" type="button"> Favorito </button>
        </section>
        <section>
            <h2> Buscar imagen por fecha</h2>
            <form id="formulario-busqueda">
                <label for="fecha">Selecciona una fecha: </label>
                <input type="text" id="fecha" min="1995-06-16" required>

                <button id=buscar type="submit">Buscar</button>
            </form>
        </section>
        <section>
            <h2>Imagenes favoritas</h2>
            <ul id="listado-favoritas"></ul>
        </section>
    </main>

    <script src="node_modules/dayjs/dayjs.min.js"></script>
    <script src="node_modules/dayjs/locale/es.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
